[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earth-forensic-model"
version = "0.1.0"
description = "Reproducible Earth-system hypothesis testing for the HIA Geodetic Codex"
requires-python = ">=3.11"
license = {text = "See parent repository"}
authors = [
  {name = "Glenn Andersen"}
]
dependencies = []

[project.scripts]
earth-forensic-model = "earth_forensic_model.cli:main"

[tool.setuptools]
packages = ["earth_forensic_model"]
